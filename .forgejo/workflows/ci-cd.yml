name: CI/CD

on:
  push:
    tags: 'v*'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run ruff
        run: uv run ruff check

  types-mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run mypy
        run: uv run mypy .

  types-basedpyright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run basedpyright
        run: uv run basedpyright

  types-ty:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run ty
        run: uv run ty check

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest --cov --cov-fail-under 100

  build:
    needs: [lint, types-mypy, types-basedpyright, types-ty, tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Upload dist artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: dist
          path: dist
        retention-days: 1

  publish:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Download dist artifact
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish

  release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Download dist artifact
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create Forgejo Release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.7.3
        with:
          url: "https://codeberg.org"
          repo: "theo-guerin/envkit"
          direction: upload
          release-dir: dist
          token: ${{ secrets.FORGEJO_TOKEN }}
          release-notes-assistant: true
