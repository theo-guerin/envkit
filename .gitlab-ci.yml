stages:
  - check
  - build
  - publish
  - release

variables:
  PYTHON_VERSION: "3.12"
  BASE_LAYER: alpine
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

.uv-cache:
  image: ghcr.io/astral-sh/uv:python$PYTHON_VERSION-$BASE_LAYER
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR

uv-install:
  extends: .uv-cache
  stage: .pre
  script:
    - uv sync --locked --all-extras --dev

check:lint:
  extends: .uv-cache
  stage: check
  rules:
    - changes:
        - .gitlab-ci.yml
        - uv.lock
        - "**/*.py"
  script:
    - uv run ruff check --output-format=gitlab --output-file=lint-report.json
  artifacts:
    when: always
    reports:
      codequality: lint-report.json
  cache:
    policy: pull

check:types-basedpyright:
  extends: .uv-cache
  stage: check
  rules:
    - changes:
        - .gitlab-ci.yml
        - uv.lock
        - "**/*.py"
  script:
    - uv run basedpyright --gitlabcodequality=types-basedpyright-report.json
  artifacts:
    when: always
    reports:
      codequality: types-basedpyright-report.json
  cache:
    policy: pull

check:types-mypy:
  extends: .uv-cache
  stage: check
  rules:
    - changes:
        - .gitlab-ci.yml
        - uv.lock
        - "**/*.py"
  script:
    - |
      mypy --output=json . > mypy-out.json
      MYPY_EXIT_CODE=$?

      mypy-gitlab-code-quality < mypy-out.json > types-mypy-report.json

      exit $MYPY_EXIT_CODE
  artifacts:
    when: always
    reports:
      codequality: types-mypy-report.json
  cache:
    policy: pull

check:tests:
  extends: .uv-cache
  stage: check
  rules:
    - changes:
        - .gitlab-ci.yml
        - uv.lock
        - "**/*.py"
  script:
    - uv run pytest --cov --cov-report term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  cache:
    policy: pull

build:package:
  extends: .uv-cache
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv build --no-create-gitignore
  artifacts:
    when: on_success
    paths:
      - dist/*
  cache:
    policy: pull

publish:pypi:
  extends: .uv-cache
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv publish --token "$UV_PUBLISH_TOKEN"
  cache:
    policy: pull

release:gitlab:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating GitLab Release for tag $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: |
      Automated release created from tag $CI_COMMIT_TAG.

      Commit: $CI_COMMIT_SHA
    assets:
      links:
        - name: "Download Package"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build%3Apackage"
          link_type: "package"
